name: Web performance monitor

on:
  schedule:
    # Keep in sync with slotsUtc in config.json
    - cron: '0 0,10,17,21 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Test only this URL (leave blank for all pages in config.json)'
        required: false
        default: ''
      runs:
        description: 'Lighthouse runs per page (blank = config.json value)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: perf-monitor
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lighthouse (lab data)
        run: node scripts/measure.mjs
        env:
          ONLY_URL: ${{ inputs.url }}
          RUNS: ${{ inputs.runs }}

      - name: CrUX (real-user field data)
        if: always()
        run: node scripts/crux.mjs
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit-data.sh
